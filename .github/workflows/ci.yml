name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint, and type-check
        run: |
          pnpm format:check
          pnpm lint
          pnpm lint:css
          pnpm check:electron
          pnpm check:workflows

      - name: Test
        run: |
          pnpm test
          pnpm test:coverage

      - name: Build renderer
        run: |
          pnpm build
          pnpm check:bundle

      - name: Audit the complete release lockfile
        run: pnpm audit --audit-level high

      - name: Package Windows application and installer
        run: pnpm pack:win:offline

      - name: Smoke-test packaged application
        run: |
          pnpm smoke:win:packaged
          pnpm smoke:win:installer

  database:
    name: Replay and test Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0

      - name: Start a fresh local database and replay migrations
        run: supabase db start

      - name: Lint and test schema, RLS, and RPC contracts
        run: |
          supabase db lint --local --level error
          supabase test db --local

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
