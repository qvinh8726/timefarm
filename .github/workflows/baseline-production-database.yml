name: Baseline existing Supabase production database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  baseline:
    name: Verify hosted v0005 schema and baseline migration history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require deployment commit on master
        run: |
          test "$GITHUB_REF" = "refs/heads/master"
          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0

      - name: Require production migration credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Require an empty migration ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          migration_list="$(supabase migration list --linked)"
          printf '%s\n' "$migration_list"
          for version in 0001 0002 0003 0004 0005 0006 0007; do
            remote_version="$(printf '%s\n' "$migration_list" | awk -F '|' -v local="$version" '$2 ~ local { gsub(/[[:space:]]/, "", $3); print $3 }')"
            test -z "$remote_version" || {
              echo "Refusing to baseline: hosted migration history is not empty ($version)." >&2
              exit 1
            }
          done

      - name: Verify hosted schema matches migration 0005
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db dump --linked --schema public --file hosted-schema.sql
          for sentinel in \
            'CREATE TABLE public.sync_entity_versions' \
            'workly_apply_sync_operation' \
            'workly_bootstrap_page_v2' \
            'workly_get_entity_revisions'; do
            grep -F "$sentinel" hosted-schema.sql >/dev/null
          done
          for forbidden in \
            'CREATE TABLE public.sync_change_retention' \
            'workly_apply_sync_operation_cas_unchecked' \
            'work_sessions_user_latest_completed_idx'; do
            if grep -F "$forbidden" hosted-schema.sql >/dev/null; then
              echo "Refusing to baseline: hosted schema is newer than migration 0005 ($forbidden)." >&2
              exit 1
            fi
          done

      - name: Mark migrations 0001 through 0005 as applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration repair --linked --status applied 0001 0002 0003 0004 0005

      - name: Verify only migrations 0006 and 0007 remain pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          migration_list="$(supabase migration list --linked)"
          printf '%s\n' "$migration_list"
          for applied in 0001 0002 0003 0004 0005; do
            remote_version="$(printf '%s\n' "$migration_list" | awk -F '|' -v local="$applied" '$2 ~ local { gsub(/[[:space:]]/, "", $3); print $3 }')"
            test "$remote_version" = "$applied"
          done
          dry_run="$(supabase db push --dry-run)"
          printf '%s\n' "$dry_run"
          printf '%s\n' "$dry_run" | grep -F '0006_production_hardening.sql' >/dev/null
          printf '%s\n' "$dry_run" | grep -F '0007_sync_contract_and_retention.sql' >/dev/null
          for baseline in 0001_workly_schema.sql 0002_bootstrap_snapshot.sql 0003_atomic_workspace_claim.sql 0004_paginated_bootstrap.sql 0005_optimistic_revisions.sql; do
            if printf '%s\n' "$dry_run" | grep -F "$baseline" >/dev/null; then
              echo "Refusing to continue: baseline migration remains pending ($baseline)." >&2
              exit 1
            fi
          done
